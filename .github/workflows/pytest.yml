name: Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.sha }}
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        version: "0.11.7"
    - name: Install dependencies
      run: uv sync --locked --group test --extra extra --extra harmony --extra leiden
    - name: Test with pytest
      run: uv run --no-sync pytest --cov=scarf --cov-report=xml
    - name: Upload coverage to Codecov
      if: github.event_name != 'release'
      uses: codecov/codecov-action@v5
      with:
        fail_ci_if_error: false
