[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scarf"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Scarf: A scalable tool for single-cell omics data analysis"
readme = "pypi_README.rst"
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Parashar Dhapola", email = "parashar.dhapola@gmail.com"}]
keywords = ["single-cell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/NygenAnalytics/scarf"
Documentation = "https://scarf.readthedocs.io/en/latest/"

[tool.setuptools]
include-package-data = false
script-files = ["bin/sgtsne"]

[tool.setuptools.packages.find]
include = ["scarf*"]
exclude = ["scarf.tests*"]
namespaces = false

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
extra = {file = ["requirements_extra.txt"]}

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "topacedo",
    "anndata==0.11.4",
    "pcst-fast",
]
docs = [
    "anndata==0.11.4",
    "jinja2",
    "jedi",
    "myst-parser",
    "myst-nb",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinx-external-toc",
    "sphinx-tabs",
    "topacedo",
    "nbclient<=0.8",
]

[tool.uv.extra-build-variables]
hnswlib = { HNSWLIB_NO_NATIVE = "1" }

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v"
testpaths = [
    "scarf/tests",
    "tests",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 50
exclude = [
    "setup.py",
    "docs",
    "scarf/tests"
]
ignore-regex = [
    "^get$",
    "^mock_.*",
    ".*BaseClass.*"
]
verbose = 2
quiet = false
whitelist-regex = []
color = true
generate-badge = '.'
badge-format = "svg"
